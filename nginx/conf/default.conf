# ─── 後端位址 ────────────────────────────────────────────────────
# 用變數 + resolver 讓 nginx 依 TTL 重新解析：
# 後端容器重啟換 IP 後，不會還連到舊的位址。
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── WebSocket 升級判定 ──────────────────────────────────────────
# 只有 client 真的送了 Upgrade 才轉發 upgrade，否則送 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── 壓縮 ────────────────────────────────────────────────────────
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server_tokens off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # ─── 安全表頭 ────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── 前端靜態檔 ──────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # 帶雜湊的檔名可以永久快取；index.html 絕不快取，否則改版後使用者拿到舊的入口
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA：找不到實體檔就交給前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── 圖層(獨立行程) ──────────────────────────────────────────
    # 必須放在 /api/ 之前：nginx 的前綴比對取最長者，但順序仍影響可讀性，
    # 而且圖層有自己的快取策略，混在一般 API 裡會被錯誤地當成動態內容
    location /api/tiles/ {
        set $tiles http://tiles:3010;
        proxy_pass $tiles;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        # 圖層可能是幾 MB 的 JSON，交給 nginx 壓縮
        gzip on;
        gzip_types application/json;
    }

    # ─── API ─────────────────────────────────────────────────────
    location /api/ {
        set $api http://api:3008;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── API 文件 ────────────────────────────────────────────────
    location ~ ^/api-docs {
        set $docs http://api:3008;
        proxy_pass $docs;
        proxy_set_header Host $host;
    }

    # ─── WebSocket(即時看板) ─────────────────────────────────────
    location /ws {
        set $ws http://api:3008;
        proxy_pass $ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;   # 看板連線是長連線，別讓 nginx 主動砍掉
    }
}

# ─── 後端位址 ────────────────────────────────────────────────────
# 用變數 + resolver 讓 nginx 依 TTL 重新解析：
# 後端容器重啟換 IP 後，不會還連到舊的位址。
resolver 127.0.0.11 valid=10s ipv6=off;

# ─── WebSocket 升級判定 ──────────────────────────────────────────
# 只有 client 真的送了 Upgrade 才轉發 upgrade，否則送 close
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── 壓縮 ────────────────────────────────────────────────────────
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server_tokens off;

server {
    listen 80;
    server_name _;

    include /etc/nginx/conf.d/site.inc;
}

# ─── 備援 port ───────────────────────────────────────────────────
# 給拿不到主要 port 的環境使用（防火牆擋掉、或機房只配一個 port 給我們）。
#
# 容器內固定聽 8081，對外開哪一個由 compose 的 HTTP_ALT_PORT 決定 ——
# 例如 HTTP_ALT_PORT=8080 時客戶連 http://主機:8080，這裡不必跟著改。
# 預設只綁在 127.0.0.1，不設 HTTP_ALT_PORT 就等於沒開。
#
# 正式站台補上 TLS 之後，這個 block 與主要 block 一起加 ssl 即可，
# 因為它們共用同一份 site.inc。
server {
    listen 8081;
    server_name _;

    include /etc/nginx/conf.d/site.inc;
}

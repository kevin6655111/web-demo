# 道路巡查 Demo —— 一個 compose 檔跑完整套系統
#
# 分層的理由是「壞的方式不同」：
#   api      使用者等在螢幕前，要快、要能水平擴充
#   worker   吃記憶體、會逾時的活，掛掉不該影響查詢
#   redis    佇列 + 冪等鍵 + 事件匯流排
#   postgres PostGIS 空間查詢
#   minio    案件影像
#   nginx    TLS 終結、靜態檔、反向代理

services:
  nginx:
    build:
      context: ./app
      dockerfile: ../Dockerfile
      target: frontend-server
    container_name: patrol-nginx
    environment:
      - TZ=Asia/Taipei
    ports:
      - "18080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [patrol-net]
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro

  api:
    build:
      context: ./app
      dockerfile: ../Dockerfile
      target: backend
    container_name: patrol-api
    command: ["node", "-r", "./server/register.js", "dist/server/server.js"]
    environment:
      - NODE_ENV=production   # 決定讀 prod.yaml 還是 dev.yaml
      - PORT=3008
      - TZ=Asia/Taipei
      - DOMAIN=${DOMAIN:-localhost}
    expose:
      - "3008"
    ports:
      - "13008:3008"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    volumes:
      # 設定與機密都用唯讀掛載：容器裡不留可寫的密碼副本
      - ./config/config.prod.yaml:/app/config/config.prod.yaml:ro
      - ./.env:/app/.env:ro
      - api_logs:/app/logs
    restart: unless-stopped
    networks: [patrol-net]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3008/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  tiles:
    build:
      context: ./app
      dockerfile: ../Dockerfile
      target: backend
    container_name: patrol-tiles
    command: ["node", "-r", "./server/register.js", "dist/server/tiles.js"]
    environment:
      - NODE_ENV=production
      - PORT=3010
      - RUN_MIGRATIONS=false   # 只有 api 跑 migration
      - TZ=Asia/Taipei
    expose:
      - "3010"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./config/config.prod.yaml:/app/config/config.prod.yaml:ro
      - ./.env:/app/.env:ro
    restart: unless-stopped
    networks: [patrol-net]

  worker:
    build:
      context: ./app
      dockerfile: ../Dockerfile
      target: backend
    container_name: patrol-worker
    command: ["node", "-r", "./server/register.js", "dist/server/worker.js"]
    environment:
      - NODE_ENV=production
      - RUN_MIGRATIONS=false
      - TZ=Asia/Taipei
    depends_on:
      api:
        condition: service_healthy   # 等 API 跑完 migration 再啟動，避免兩邊搶著建表
    volumes:
      - ./config/config.prod.yaml:/app/config/config.prod.yaml:ro
      - ./.env:/app/.env:ro
      - worker_logs:/app/logs
    restart: unless-stopped
    networks: [patrol-net]
    # 案件處理要吞吐，開多一點沒關係
    deploy:
      resources:
        limits:
          memory: 1g

  report-worker:
    build:
      context: ./app
      dockerfile: ../Dockerfile
      target: backend
    container_name: patrol-report-worker
    command: ["node", "-r", "./server/register.js", "dist/server/report-worker.js"]
    environment:
      - NODE_ENV=production
      - RUN_MIGRATIONS=false
      - TZ=Asia/Taipei
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./config/config.prod.yaml:/app/config/config.prod.yaml:ro
      - ./.env:/app/.env:ro
      - worker_logs:/app/logs
    restart: unless-stopped
    networks: [patrol-net]
    # 報表一份就吃掉幾百 MB，記憶體上限要比案件 worker 高
    deploy:
      resources:
        limits:
          memory: 2g

  scheduler:
    build:
      context: ./app
      dockerfile: ../Dockerfile
      target: backend
    container_name: patrol-scheduler
    command: ["node", "-r", "./server/register.js", "dist/server/scheduler.js"]
    environment:
      - NODE_ENV=production
      - RUN_MIGRATIONS=false
      - TZ=Asia/Taipei
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./config/config.prod.yaml:/app/config/config.prod.yaml:ro
      - ./.env:/app/.env:ro
      - scheduler_logs:/app/logs
    restart: unless-stopped
    networks: [patrol-net]
    # 排程只能有一份在跑：真要多開，Redis 鎖會擋住重複執行，但沒有必要
    deploy:
      replicas: 1

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: patrol-postgres
    environment:
      - TZ=Asia/Taipei
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=patrol_demo
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [patrol-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d patrol_demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: patrol-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [patrol-net]

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: patrol-minio
    environment:
      - TZ=Asia/Taipei
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks: [patrol-net]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── 日誌監控 ────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.2.1
    container_name: patrol-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    restart: unless-stopped
    networks: [patrol-net]

  promtail:
    image: grafana/promtail:3.2.1
    container_name: patrol-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      # 讀容器日誌需要這兩個掛載；都是唯讀
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/var/lib/promtail
    depends_on:
      - loki
    restart: unless-stopped
    networks: [patrol-net]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: patrol-grafana
    environment:
      - TZ=Asia/Taipei
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://localhost:13000/
      # 內嵌到自家看板時需要；Demo 預設關閉
      - GF_SECURITY_ALLOW_EMBEDDING=false
    ports:
      - "13000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks: [patrol-net]

networks:
  patrol-net:
    name: patrol-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_logs:
  worker_logs:
  scheduler_logs:
  loki_data:
  grafana_data:
  promtail_positions:

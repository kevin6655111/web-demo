# 部署用設定：每個站台一份。與 dev 的差異只有「連哪台主機」，機密共用同一份 .env
client: DEMO

app:
  name: 道路巡查 Demo
  port:
    http: 3008
    ws: 3002
  jwt:
    secret: ${JWT_SECRET}
    expiresInSec: 1800
  password:
    saltRounds: 10
    minLength: 8
    cooldownHours: 24 # 兩次改密碼的最短間隔
    historyDepth: 3 # 不可與最近 3 次相同
    maxAgeDays: 0 # 0 = 不強制定期更換(NIST 建議)
  sift:
    unitPrice: 0.15 # 二篩每件單價
    errorPrice: 0.3 # 覆核為誤判時每件扣款

database:
  vendor: postgres
  postgres:
    host: postgres # docker compose 的服務名稱
    port: 5432
    name: patrol_demo
    user: ${POSTGRES_USER}
    pass: ${POSTGRES_PASSWORD}

redis:
  host: redis
  port: 6379

storage:
  backend: MINIO
  minio:
    endPoint: http://minio:9000
    # 給瀏覽器用的位址。
    #
    # 不能走 nginx 轉發再剝掉路徑前綴 —— S3 的簽章涵蓋路徑與 Host，
    # 前綴被剝掉之後 MinIO 算出來的簽章就對不上，一律 403。
    # 所以直接指向 MinIO 對外發布的埠，並讓部署時能用環境變數覆寫。
    publicEndPoint: ${MINIO_PUBLIC_URL}
    region: us-east-1
    bucket: patrol-demo
    accessKey: ${MINIO_ROOT_USER}
    secretKey: ${MINIO_ROOT_PASSWORD}

task:
  # 總開關；關掉就完全不註冊排程(本機開發常關掉，免得每分鐘洗版)
  active: true

  # 個別排程開關。cron 與逾時寫在 server/src/task/task-definitions.ts，
  # 站台只決定「要不要跑」——時間點是工程判斷，不該各站各改。
  schedule:
    caseAutoCode: true # 案件編碼      07:00-22:59 每分鐘
    databaseBackup: false # 資料庫備份    每日 23:50(Demo 只做備份前檢查)
    lineNotify: true # 通知推播      每日 14:00、18:00
    roadEvalStat: true # 道路評估統計  每日 23:00
    dailyCheck: true # 上傳狀態檢查  08:45-23:45 每小時
    patrolPointCov: true # 點位覆蓋率統計 每小時
    caseProgress: true # 案件處理進度  每小時 15 分
    addressGeocoder: true # 地址編碼      每日 20:00
    pathUpdater: true # 報表檔案清理  每日 01:00
    dashboardSync: true # 儀表板結算    每日 23:30
    tilesWarmup: true # 圖層預熱      每日 07:00、08:00
    partitionMaintain: true # 資料表維護    每月 1 日 03:00

# 資料來源用檔案 provisioning 而不是手動點：
# 重建容器後不必再設定一次，也讓設定進得了版控。
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 2000
      # 從日誌跳到對應的追蹤(若日後接上 Tempo)；先留好欄位對應
      derivedFields:
        - name: RequestId
          matcherRegex: 'x-request-id=(\w+)'
          url: ''
